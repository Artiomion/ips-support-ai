services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ips
      POSTGRES_PASSWORD: ips
      POSTGRES_DB: ips
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ips -d ips"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
