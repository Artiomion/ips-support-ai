name: Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ips
          POSTGRES_PASSWORD: ips
          POSTGRES_DB: ips
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ips -d ips"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://ips:ips@localhost:5432/ips
      IPS_REQUIRE_DATABASE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ty check src
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen pytest -q
        env:
          IPS_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: uv run --frozen python -m ips.core.export_openapi --check ../contracts/openapi.json

  stack-smoke:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: ips-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start the demo
        run: docker compose -f infra/compose.yaml up -d --build --wait --wait-timeout 90
      - name: Check API, web, widget and Mailpit
        run: |
          curl --fail --silent --show-error http://localhost:8000/health/ready
          curl --fail --silent --show-error http://localhost:5173/invite -o /dev/null
          curl --fail --silent --show-error http://localhost:5174/loader.js -o /dev/null
          curl --fail --silent --show-error http://localhost:8025/ -o /dev/null
      - name: Seed both demo organizations
        env:
          IPS_DEMO_PASSWORD: ci-only-synthetic-demo-password
        run: |
          docker compose -f infra/compose.yaml run --rm --no-deps -e IPS_DEMO_PASSWORD api \
            python tests/integration/demo_seed.py
      - name: Show logs on failure
        if: failure()
        run: docker compose -f infra/compose.yaml logs --no-color
      - name: Remove the CI stack
        if: always()
        run: docker compose -f infra/compose.yaml down --volumes
