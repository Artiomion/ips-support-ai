name: Backend

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ips
          POSTGRES_PASSWORD: ips
          POSTGRES_DB: ips
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ips -d ips"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://ips:ips@localhost:5432/ips
      IPS_REQUIRE_DATABASE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ty check src
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python -m ips.core.export_openapi --check ../contracts/openapi.json
