name: Integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tenant-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ips
          POSTGRES_PASSWORD: ips
          POSTGRES_DB: ips
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ips -d ips"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ips:ips@127.0.0.1:5432/ips
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run --frozen alembic upgrade head
        working-directory: backend
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
